name: update-citations
run-name: Update citations

on:
  # called by on-push/on-pull-request/on-schedule
  workflow_call:
    inputs:
      open-pr:
        type: boolean
        default: false

  # run manually by user
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

env:
  FORCE_COLOR: true

jobs:
  update-citations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SCHOLAR_API_KEY: ${{ secrets.GOOGLE_SCHOLAR_API_KEY }}

    steps:
      - name: Checkout main branch contents
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch || github.ref_name }}

      # safely load limited artifact to input into cite process
      - name: Download sources artifact
        if: github.event.number != ''
        uses: actions/download-artifact@v8
        with:
          name: sources
          path: _data

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade --requirement ./_cite/requirements.txt

      - name: Build updated citations
        run: python _cite/cite.py
        timeout-minutes: 15

      - name: Check if citations changed
        id: files-changed
        uses: tj-actions/verify-changed-files@v20
        with:
          files: |
            _data/citations.yaml

      - name: Stash updated citations
        if: |
          steps.files-changed.outputs.files_changed == 'true' &&
          github.event.number != ''
        run: cp _data/citations.yaml "$RUNNER_TEMP/citations.yaml"

      - name: Checkout PR branch contents
        if: |
          steps.files-changed.outputs.files_changed == 'true' &&
          github.event.number != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        # checks out potentially untrusted code
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.head_ref }}

      - name: Restore updated citations
        if: |
          steps.files-changed.outputs.files_changed == 'true' &&
          github.event.number != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: cp "$RUNNER_TEMP/citations.yaml" _data/citations.yaml

      - name: Commit citations to main branch
        if: |
          steps.files-changed.outputs.files_changed == 'true' &&
          inputs.open-pr != true &&
          github.event.number == ''
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: _data/citations.yaml
          commit_message: "Update citations"

      - name: Open pull request with citations
        if: |
          steps.files-changed.outputs.files_changed == 'true' &&
          inputs.open-pr == true &&
          github.event.number == ''
        uses: peter-evans/create-pull-request@v8
        with:
          branch: citation-update
          title: Periodic citation update
          body: |
            To see a live preview of this PR, close (don't merge) and reopen it.

      - name: Commit citations to branch PR
        # committing to fork (head != base) not supported
        if: |
          steps.files-changed.outputs.files_changed == 'true' &&
          inputs.open-pr != true &&
          github.event.number != '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: _data/citations.yaml
          commit_message: "Update citations"
